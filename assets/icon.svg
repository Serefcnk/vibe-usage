<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vibe Usage: one ring per tool's quota left, around a "V". The tray draws a single ring of
       the same kind. Source of assets/icon.png (npm run icons). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2e25" />
      <stop offset="1" stop-color="#0a120e" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- The macOS icon grid: an 824 px rounded square with room for its shadow. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="url(#sheen)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />

  <!-- Each ring is a track and the quota left on it, clockwise from twelve o'clock.
       pathLength 100 makes stroke-dasharray read as a percentage. -->
  <g fill="none" stroke-linecap="round" stroke-width="58" transform="rotate(-90 512 512)">
    <circle cx="512" cy="512" r="290" stroke="#22c55e" stroke-opacity="0.18" />
    <circle cx="512" cy="512" r="212" stroke="#38bdf8" stroke-opacity="0.18" />
    <circle cx="512" cy="512" r="134" stroke="#f59e0b" stroke-opacity="0.18" />
    <g filter="url(#glow)">
      <circle cx="512" cy="512" r="290" stroke="#22c55e" pathLength="100" stroke-dasharray="78 100" />
      <circle cx="512" cy="512" r="212" stroke="#38bdf8" pathLength="100" stroke-dasharray="56 100" />
      <circle cx="512" cy="512" r="134" stroke="#f59e0b" pathLength="100" stroke-dasharray="34 100" />
    </g>
  </g>

  <path d="M466 478 L512 554 L558 478" fill="none" stroke="#ecfdf5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
</svg>
